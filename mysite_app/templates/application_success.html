<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>send application</title>
<style>
  body { font-family:'Segoe UI', Arial, sans-serif; background:#f4f6fa; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .box { background:#fff; border-radius:16px; padding:30px; text-align:center; max-width:400px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  .box .icon { font-size:40px; margin-bottom:10px; }
  .box h2 { font-size:18px; margin-bottom:8px; }
  .box p { font-size:14px; color:#666; line-height:1.5; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h2>Your application has been received</h2>
    <p>We will inform you  through phone number or email when you appointed to join with us.</p>
  </div>
</body>
</html>
