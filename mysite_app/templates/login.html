{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #2e8b74;
  }

  .card {
    width: 360px;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,.25);
  }

  .top {
    background: #a9d6c8;
    padding: 40px 32px 60px;
  }

  .cap-icon {
    width: 56px;
    height: 56px;
    background: #fff;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .top h1 {
    color: #173b33;
    font-size: 34px;
    margin-bottom: 6px;
  }

  .subtitle {
    color: #1f4a3f;
    font-size: 15px;
  }

  .bottom {
    background: #fff;
    padding: 32px;
    margin-top: -30px;
    border-radius: 24px 24px 0 0;
  }

  .bottom h2 {
    font-size: 26px;
    color: #16281f;
    margin-bottom: 22px;
  }

  .error-box {
    background: #fdeaea;
    color: #c0392b;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }

  .input-group {
    display: flex;
    align-items: center;
    background: #f4f6f6;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .input-icon {
    margin-right: 10px;
    color: #6b7a76;
  }

  .input-group input {
    border: none;
    outline: none;
    background: transparent;
    width: 100%;
    font-size: 15px;
    color: #16281f;
  }

  .forgot {
    display: block;
    text-align: right;
    font-size: 13px;
    color: #6b7a76;
    text-decoration: none;
    margin-bottom: 22px;
  }

  .login-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #14524a;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
  }

  .login-btn:hover {
    background: #0d3d37;
  }

  .divider {
    display: flex;
    align-items: center;
    text-align: center;
    color: #9aa5a2;
    font-size: 13px;
    margin: 24px 0 20px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    border-bottom: 1px solid #e2e6e5;
  }

  .divider span {
    padding: 0 12px;
  }

  .signup-link {
    text-align: center;
    font-size: 14px;
    color: #6b7a76;
  }

  .signup-link a {
    color: #14524a;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="card">

    <div class="top">
      <div class="cap-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="#173b33">
          <path d="M12 3 1 8l11 5 9-4.09V17h2V8L12 3zm0 8.5L4.5 8 12 4.5 19.5 8 12 11.5zM6 12.18v3.32c0 1.5 2.69 3.5 6 3.5s6-2 6-3.5v-3.32l-6 2.73-6-2.73z"/>
        </svg>
      </div>
      <h1>Hello!</h1>
      <p class="subtitle">Welcome Student</p>
    </div>

    <div class="bottom">
      <h2>Login</h2>

      {% if error %}
        <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="input-group">
          <span class="input-icon">👤</span>
          <input type="text" name="username" placeholder="Username" required autofocus>
        </div>

        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" name="password" placeholder="Password" required>
        </div>

        <a href="#" class="forgot">Forgot Password</a>

        <button type="submit" class="login-btn">Login</button>
      </form>

      <div class="divider"><span>No Account?</span></div>

      <div class="signup-link">
        <a href="{% url 'signup' %}">Signup</a>
      </div>
    </div>

  </div>

</body>
</html>
