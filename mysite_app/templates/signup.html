{% load static %}
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
  body { min-height:100vh; display:flex; justify-content:center; align-items:center; background:#2e8b74; padding:20px; }
  .card { width:360px; border-radius:22px; overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,.25); }
  .top { background:#a9d6c8; padding:36px 32px 50px; }
  .cap-icon { width:56px; height:56px; background:#fff; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .top h1 { color:#173b33; font-size:28px; margin-bottom:6px; }
  .subtitle { color:#1f4a3f; font-size:14px; }
  .bottom { background:#fff; padding:30px 32px; margin-top:-26px; border-radius:24px 24px 0 0; }
  .bottom h2 { font-size:22px; color:#16281f; margin-bottom:18px; }
  .error-box { background:#fdeaea; color:#c0392b; font-size:13px; padding:10px 14px; border-radius:8px; margin-bottom:16px; }
  form p { margin:0 0 16px; }
  form label { display:block; font-size:12px; font-weight:700; color:#3a4270; margin-bottom:6px; text-transform:uppercase; }
  form input { width:100%; background:#f4f6f6; border:1.5px solid transparent; border-radius:10px; padding:14px 16px; font-size:15px; color:#16281f; outline:none; }
  form input:focus { border-color:#14524a; background:#fff; }
  button[type="submit"] { width:100%; margin-top:6px; padding:15px; border:none; border-radius:10px; background:#14524a; color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button[type="submit"]:hover { background:#0d3d37; }
  .login-link { text-align:center; font-size:14px; color:#6b7a76; margin-top:16px; }
  .login-link a { color:#14524a; font-weight:600; text-decoration:none; }
</style>
</head>
<body>

  <div class="card">
    <div class="top">
      <div class="cap-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="#173b33">
          <path d="M12 3 1 8l11 5 9-4.09V17h2V8L12 3zm0 8.5L4.5 8 12 4.5 19.5 8 12 11.5zM6 12.18v3.32c0 1.5 2.69 3.5 6 3.5s6-2 6-3.5v-3.32l-6 2.73-6-2.73z"/>
        </svg>
      </div>
      <h1>Welecom student</h1>
      <p class="subtitle">Complete your Account</p>
    </div>

    <div class="bottom">
      <h2>Sign Up</h2>

      {% if form.non_field_errors %}
        <div class="error-box">{{ form.non_field_errors.0 }}</div>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Open account</button>
      </form>

      <div class="login-link">
        Allready have account? <a href="{% url 'login' %}">sign in</a>
      </div>
    </div>
  </div>

</body>
</html>
